name: Bug report
description: Report a reproducible defect in this repository
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        The canonical organization context is `the-sloppery/sloppery-dev`.
        Include only repository-safe details; never paste credentials or private data.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest deterministic reproduction and exact command or path.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Source commit
      description: Full 40-character commit tested.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and checks
      description: List the checks actually run and link safe artifacts.
    validations:
      required: true
