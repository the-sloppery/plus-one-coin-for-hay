name: Repository contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, ww-linux]
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
      - name: Validate organization contract
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('.github/repository-contract.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('organization') != 'the-sloppery':
              raise SystemExit('repository contract has the wrong organization')
          if data.get('repository') != os.environ['EXPECTED_REPOSITORY'].split('/', 1)[1]:
              raise SystemExit('repository contract does not match this repository')
          for required in ('.github/ISSUE_TEMPLATE/config.yml', '.github/ISSUE_TEMPLATE/bug.yml', '.github/ISSUE_TEMPLATE/feature.yml', '.github/ISSUE_TEMPLATE/task.yml', '.github/PULL_REQUEST_TEMPLATE.md', 'docs/AGENT_CONTEXT.md'):
              if not pathlib.Path(required).exists() and not pathlib.Path(required).is_symlink():
                  raise SystemExit(f'missing required contract file: {required}')
          print('repository contract: OK')
          PY
